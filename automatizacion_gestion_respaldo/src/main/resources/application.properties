spring.application.name=automatizacion_gestion_respaldo

# Repositorio interno (Oracle)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=rman_admin
spring.datasource.password=root
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Jasypt (solo se usa para cifrar las credenciales de las bases objetivo)
jasypt.encryptor.password=clave_dev_jasypt
jasypt.encryptor.algorithm=PBEWITHHMACSHA512ANDAES_256
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.RandomIvGenerator
jasypt.encryptor.salt-generator-classname=org.jasypt.salt.RandomSaltGenerator

# Ejecutor RMAN: mock | real
rman.executor.mode=mock
rman.executable=rman
rman.logs-dir=./logs/rman
rman.scripts-dir=./scripts/rman